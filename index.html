<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>Baguette Pro</title>
<style>
html,body{height:100%;margin:0;background:#101010;color:#fff8e8;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.box{max-width:420px}.brand{font-size:30px;font-weight:900;letter-spacing:2px;color:#FFD000}
.small{color:#b7b1a5;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div class="box">
  <div class="brand">BAGUETTE PRO</div>
  <div class="small">Loading your menu…</div>
</div>

<script>
(function(){
  var ua = navigator.userAgent || '';
  var isIPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || isIPadOS;

  window.location.replace(isIOS ? 'iphone.html' : 'android.html');
})();
</script>
</body>
</html>
